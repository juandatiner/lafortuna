<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo — Gobernanza Inteligente DTLF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.topbar{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:6px;background:#FFFFFF;padding:5px 10px;border-radius:999px;box-shadow:0 4px 14px rgba(5,15,13,.09);font-weight:800;color:#0E332C;font-size:11px;letter-spacing:.2px}
.brand-dot{width:6px;height:6px;border-radius:50%;background:#B9820C;flex-shrink:0}

/* ===== Content system (hereda el lenguaje visual de tesis.html) ===== */
.tc-wrap{position:absolute;inset:0;overflow-y:auto;padding:44px 56px 72px;background:
  radial-gradient(circle at 30% 0%, rgba(227,168,59,.10) 0%, transparent 44%),
  var(--shell-base,#F6F3EC)}
.tc-eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#B9820C;margin-bottom:10px}
.tc-title{font-family:'Playfair Display',serif;font-weight:800;font-size:1.9rem;color:#16211C;margin-bottom:16px;max-width:900px;letter-spacing:-.3px}
.tc-lead{background:linear-gradient(160deg,#0E332C 0%,#123c33 100%);color:#FBF6EC;border-radius:18px;padding:22px 26px;font-size:1rem;line-height:1.65;margin-bottom:26px;max-width:1040px;box-shadow:0 14px 34px rgba(16,27,22,.18)}
.tc-lead b{color:#FFD37A}
.tc-section-label{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#16211C;margin:30px 0 12px;display:flex;align-items:center;gap:8px}
.tc-section-label:first-of-type{margin-top:0}
.tc-section-label::after{content:'';flex:1;height:1px;background:rgba(16,27,22,.12)}

.tc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:8px}
.tc-card{background:rgba(255,255,255,.7);border:1px solid rgba(16,27,22,.08);border-radius:16px;padding:15px 17px;box-shadow:0 8px 22px rgba(16,27,22,.05)}
.tc-card.tc-card-core{border-color:rgba(227,168,59,.55);background:rgba(255,247,225,.72)}
.tc-card-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#0E332C;color:#FFD37A;font-weight:800;font-size:11px;margin-bottom:9px}
.tc-card h4{font-size:.92rem;font-weight:800;color:#16211C;margin-bottom:6px;line-height:1.3}
.tc-card p{font-size:.82rem;line-height:1.55;color:#5C6A62}
.tc-card ul{margin:0;padding-left:16px;font-size:.8rem;line-height:1.6;color:#5C6A62}
.tc-card ul li::marker{color:#B9820C}

.tc-callout{background:rgba(227,168,59,.14);border:1px solid rgba(227,168,59,.42);border-radius:16px;padding:16px 20px;font-size:.88rem;line-height:1.6;color:#3E4C43;margin:18px 0;max-width:1040px}
.tc-callout b{color:#7E5A0A}
.tc-callout.tc-callout-warn{background:rgba(193,70,31,.09);border-color:rgba(193,70,31,.35)}
.tc-callout.tc-callout-warn b{color:#A63A18}

.tc-subtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:26px;max-width:1040px}
.tc-subtab{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:14px 18px;border-radius:16px;border:1px solid rgba(16,27,22,.1);background:rgba(255,255,255,.55);cursor:pointer;transition:background .2s ease,transform .2s ease,box-shadow .2s ease}
.tc-subtab:hover{background:rgba(255,255,255,.9)}
.tc-subtab .tc-subtab-num{font-family:'Playfair Display',serif;font-weight:900;font-size:.78rem;color:#B9820C}
.tc-subtab .tc-subtab-label{font-weight:800;font-size:.86rem;color:#16211C;line-height:1.25}
.tc-subtab.active{background:#0E332C;border-color:#0E332C;box-shadow:0 12px 28px rgba(16,27,22,.22);transform:translateY(-2px)}
.tc-subtab.active .tc-subtab-num{color:#FFD37A}
.tc-subtab.active .tc-subtab-label{color:#FBF6EC}

.tc-pending{color:#9AA39C;font-style:italic}

/* ===== Prototipo: componentes propios ===== */
.pt-stage{background:rgba(255,255,255,.62);border:1px solid rgba(16,27,22,.09);border-radius:20px;padding:20px 22px 16px;box-shadow:0 12px 32px rgba(16,27,22,.07);margin-bottom:18px;overflow-x:auto}
.pt-stage svg{display:block;width:100%;min-width:900px;height:auto;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.pt-stage-cap{margin-top:12px;font-size:.78rem;line-height:1.55;color:#5C6A62;border-top:1px solid rgba(16,27,22,.08);padding-top:11px}
.pt-stage-cap b{color:#16211C}
.pt-hint{font-size:.74rem;font-weight:700;color:#B9820C;letter-spacing:.3px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.pt-hint::before{content:'';width:7px;height:7px;border-radius:50%;background:#E3A83B;flex-shrink:0}

.pt-layer{cursor:pointer}
.pt-layer .pt-layer-bg{transition:filter .2s ease}
.pt-layer:hover .pt-layer-bg{filter:brightness(.97)}
.pt-layer.is-sel .pt-layer-bg{stroke-width:2.4}

.pt-detail{background:#fff;border-radius:18px;border:1px solid rgba(16,27,22,.1);box-shadow:0 14px 34px rgba(16,27,22,.09);padding:20px 24px;margin-bottom:20px;border-left:6px solid #B9820C}
.pt-detail-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.pt-detail-num{font-family:'Playfair Display',serif;font-weight:900;font-size:1.1rem;color:#B9820C}
.pt-detail-head h4{font-size:1.02rem;font-weight:800;color:#16211C}
.pt-detail > p{font-size:.86rem;line-height:1.6;color:#5C6A62;margin-bottom:14px;max-width:880px}
.pt-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pt-mod{background:rgba(246,243,236,.75);border:1px solid rgba(16,27,22,.08);border-radius:13px;padding:12px 14px}
.pt-mod h5{font-size:.82rem;font-weight:800;color:#16211C;margin-bottom:5px}
.pt-mod p{font-size:.76rem;line-height:1.5;color:#5C6A62}

/* tabla genérica */
.pt-tablewrap{overflow-x:auto;border:1px solid rgba(16,27,22,.12);border-radius:14px;background:#fff;box-shadow:0 10px 26px rgba(16,27,22,.06);margin-bottom:18px}
table.pt-table{width:100%;min-width:760px;border-collapse:collapse;font-size:.8rem}
.pt-table th{background:#0E332C;color:#FBF6EC;font-weight:800;font-size:.7rem;letter-spacing:.4px;text-transform:uppercase;padding:11px 13px;text-align:left;vertical-align:middle}
.pt-table td{border-top:1px solid rgba(16,27,22,.09);padding:10px 13px;vertical-align:top;color:#3E4C43;line-height:1.5}
.pt-table tbody tr:nth-child(even) td{background:rgba(246,243,236,.55)}
.pt-table td.pt-rowhead{font-weight:800;color:#16211C;white-space:nowrap}
.pt-table td.pt-c{text-align:center;font-weight:800}
.pt-yes,.pt-table td.pt-yes{color:#1F6B51}
.pt-part,.pt-table td.pt-part{color:#B9820C}
.pt-no,.pt-table td.pt-no{color:#C2C9C2}
.pt-table td.pt-miss{color:#A63A18}

/* reglas de gobernanza */
.pt-rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-bottom:8px}
.pt-rule{background:#fff;border:1px solid rgba(16,27,22,.09);border-left:5px solid #B9820C;border-radius:15px;padding:15px 17px;box-shadow:0 8px 22px rgba(16,27,22,.05)}
.pt-rule-code{display:inline-block;font-family:'Playfair Display',serif;font-weight:900;font-size:.78rem;color:#B9820C;letter-spacing:.5px;margin-bottom:6px}
.pt-rule h5{font-size:.88rem;font-weight:800;color:#16211C;margin-bottom:6px;line-height:1.3}
.pt-rule p{font-size:.79rem;line-height:1.55;color:#5C6A62}
.pt-rule-tag{display:inline-block;margin-top:9px;font-size:.66rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#0A5F5D;background:rgba(12,122,120,.12);border-radius:999px;padding:3px 9px}

/* entidades del modelo de datos */
.pt-domains{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:14px;margin-bottom:8px}
.pt-domain{border-radius:18px;padding:16px 17px;border:1px solid rgba(16,27,22,.1);background:rgba(255,255,255,.6)}
.pt-domain.pt-dom-d{background:rgba(255,247,225,.72);border-color:rgba(227,168,59,.5)}
.pt-domain-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.pt-domain-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.pt-domain-head h4{font-size:.86rem;font-weight:800;color:#16211C}
.pt-ent{background:#fff;border:1px solid rgba(16,27,22,.1);border-radius:12px;margin-bottom:9px;overflow:hidden;box-shadow:0 5px 14px rgba(16,27,22,.05)}
.pt-ent:last-child{margin-bottom:0}
.pt-ent-name{padding:8px 12px;font-weight:800;font-size:.8rem;color:#FBF6EC;letter-spacing:.2px}
.pt-ent-fields{list-style:none;margin:0;padding:8px 12px 10px;font-size:.73rem;line-height:1.75;color:#3E4C43}
.pt-ent-fields li{display:flex;gap:7px}
.pt-k{flex-shrink:0;width:26px;font-weight:800;font-size:.62rem;letter-spacing:.3px;padding-top:2px}
.pt-k-pk{color:#B9820C}
.pt-k-fk{color:#0C7A78}
.pt-k-at{color:#C9CFC9}
.pt-dom-a .pt-ent-name{background:#0E332C}
.pt-dom-b .pt-ent-name{background:#0C7A78}
.pt-dom-c .pt-ent-name{background:#2E8567}
.pt-dom-d .pt-ent-name{background:#8E6309}

/* chips */
.pt-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.pt-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.8);border:1px solid rgba(16,27,22,.12);border-radius:999px;padding:6px 13px;font-size:.76rem;font-weight:700;color:#3E4C43}
.pt-chip b{color:#16211C}
.pt-chip-on{background:#0E332C;border-color:#0E332C;color:#FBF6EC}
.pt-chip-off{opacity:.5;text-decoration:line-through}

/* estado / leyenda */
.pt-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.pt-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:.7rem;font-weight:800;letter-spacing:.3px}
.pt-badge::before{content:'';width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pt-badge-prop{background:rgba(12,122,120,.12);color:#0A5F5D}
.pt-badge-prop::before{background:#0C7A78}
.pt-badge-src{background:rgba(14,51,44,.1);color:#0E332C}
.pt-badge-src::before{background:#0E332C}
.pt-badge-pend{background:rgba(92,106,98,.12);color:#5C6A62}
.pt-badge-pend::before{background:#9AA39C}
.pt-badge-out{background:rgba(193,70,31,.1);color:#A63A18}
.pt-badge-out::before{background:#C1461F}

/* figura de referencia */
.pt-figure{border-radius:18px;overflow:hidden;border:1px solid rgba(16,27,22,.12);box-shadow:0 14px 34px rgba(16,27,22,.1);cursor:zoom-in;margin-bottom:8px;max-width:1040px;background:#fff}
.pt-figure img{display:block;width:100%;height:auto}
.pt-figcap{font-size:.76rem;color:#5C6A62;line-height:1.5;margin-bottom:22px;max-width:1040px}

#ptLightbox{position:fixed;inset:0;z-index:6000;display:none;align-items:center;justify-content:center;padding:4vh 4vw;background:rgba(10,17,14,.84);backdrop-filter:blur(4px);cursor:zoom-out}
#ptLightbox.open{display:flex}
#ptLightbox img{max-width:100%;max-height:92vh;border-radius:12px;box-shadow:0 40px 100px rgba(0,0,0,.5)}
.pt-lb-close{position:absolute;top:20px;right:22px;width:36px;height:36px;border-radius:50%;background:#0E332C;color:#FFD37A;border:none;font-size:17px;font-weight:900;cursor:pointer}

/* flujo: pasos en texto */
.pt-steps{counter-reset:ptstep;display:grid;gap:10px;margin-bottom:8px}
.pt-step{display:flex;gap:14px;background:rgba(255,255,255,.65);border:1px solid rgba(16,27,22,.08);border-radius:15px;padding:14px 16px}
.pt-step-n{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#0E332C;color:#FFD37A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px}
.pt-step-b{flex:1;min-width:0}
.pt-step-b h5{font-size:.87rem;font-weight:800;color:#16211C;margin-bottom:4px}
.pt-step-b p{font-size:.79rem;line-height:1.55;color:#5C6A62}
.pt-step-who{display:inline-block;margin-top:7px;font-size:.66rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#0A5F5D;background:rgba(12,122,120,.12);border-radius:999px;padding:3px 9px}

.pt-src{font-size:.76rem;line-height:1.7;color:#5C6A62;max-width:1040px}
.pt-src a{color:#0A5F5D;font-weight:700}
.pt-src li{margin-bottom:4px}
.pt-src ul{padding-left:18px}

@media (max-width:900px){
  .tc-wrap{padding:30px 22px 60px}
  .tc-title{font-size:1.5rem}
}
</style>
</head>

<script>
document.querySelectorAll('[data-nav-toggle]').forEach(btn=>{
  btn.addEventListener('click', ()=> btn.closest('.side-nav').classList.toggle('collapsed'));
});

/* =========================================================================
   PALETA / HELPERS SVG
   ========================================================================= */
const C = {
  ink:'#16211C', inkSoft:'#5C6A62', base:'#F6F3EC',
  deep:'#0E332C', teal:'#0C7A78', tealDark:'#0A5F5D',
  gold:'#E3A83B', goldDark:'#B9820C', goldDeep:'#7E5A0A',
  green:'#2E8567', greenDark:'#1F6B51',
  clay:'#C1461F', cream:'#FBF6EC'
};

/* texto SVG partido en líneas, centrado en (cx, cyFirst) */
function svgLines(lines, cx, cy, lh, cls){
  return lines.map((t,i)=>
    '<text x="'+cx+'" y="'+(cy + i*lh)+'" text-anchor="middle" class="'+(cls||'')+'">'+t+'</text>'
  ).join('');
}
function arrow(x1,y1,x2,y2,color,dashed){
  return '<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke="'+color+'" stroke-width="1.6" fill="none" marker-end="url(#ptArrow)"'+(dashed?' stroke-dasharray="5 4"':'')+'/>';
}

/* =========================================================================
   DATOS DE LA ARQUITECTURA
   ========================================================================= */

/* --- Capas de la vista de alto nivel --- */
const CAPAS = [
  {
    n:1, name:['Actores', 'y accesos'], tone:'deep',
    title:'Actores y accesos',
    desc:'Punto de entrada del modelo. Cada actor del ecosistema entra con un rol que define qué publica, qué consulta y con qué nivel de agregación. No es un sistema de clientes: es un sistema de actores, y la diferencia es la que separa un marketplace de un modelo de gobernanza.',
    mods:[
      {t:'Cliente / visitante', d:'Explora el destino, reserva y publica su experiencia. Es fuente de información, no solo consumidor.'},
      {t:'Proveedor turístico', d:'Se inscribe, publica su portafolio de oferta y gestiona reservas. Obligado a la ficha mínima del destino.'},
      {t:'Regulador', d:'Cámara de comercio y agentes reguladores. Publica normativa y consulta el consolidado del destino y por sitio.'},
      {t:'Gobierno (ICT)', d:'Opera el nodo central. Consulta el consolidado del destino e integra indicadores a escala nacional.'},
      {t:'Academia', d:'Universidades, institutos de investigación y estudiantes. Accede a microdatos anonimizados y devuelve estudios.'},
      {t:'Administrador del nodo', d:'Gestiona actores, fuentes, reglas de intercambio y calidad del dato. Rol técnico, no decisorio.'}
    ]
  },
  {
    n:2, name:['Servicios','del destino'], tone:'teal',
    title:'Servicios del destino',
    desc:'La capa visible y transaccional: lo que el visitante y el proveedor usan a diario. Es la parte que el prototipo de e-Xiua ya resolvió razonablemente y la que menos aporta a la tesis, pero sin ella el modelo no genera el dato que la gobernanza necesita.',
    mods:[
      {t:'Catálogo de oferta', d:'Portafolio de servicios de bienestar por proveedor, con ficha mínima normalizada del destino.'},
      {t:'Reservas', d:'Disponibilidad, reserva y estado. Genera la señal de demanda real del destino.'},
      {t:'Experiencias', d:'Relato y valoración del visitante tras la visita, en la plataforma o traído desde redes sociales.'},
      {t:'Observatorio público', d:'Condiciones del destino en tiempo real: clima, índice UV, actividad del Arenal, eventos y noticias.'}
    ]
  },
  {
    n:3, name:['Gobernanza'], tone:'gold', core:true,
    title:'Gobernanza',
    desc:'El eje del modelo y el aporte propio de la tesis. Gobernanza, aquí, no es un discurso: es un conjunto explícito de reglas de intercambio entre actores, una normativa vinculada a ellas y un cuadro de indicadores del destino. Es la capa que todo flujo debe atravesar, y la que no existe en ninguno de los antecedentes revisados.',
    mods:[
      {t:'Reglas de intercambio', d:'Quién publica qué, para quién, con qué granularidad y con qué periodicidad. La gobernanza operacionalizada.'},
      {t:'Normativa y cumplimiento', d:'Marco normativo vigente emitido por reguladores, vinculado a las reglas que lo hacen exigible.'},
      {t:'Indicadores del destino', d:'Cuadro de indicadores de destino turístico inteligente, calculados sobre el dato consolidado.'},
      {t:'Coordinación institucional', d:'Espacios, acuerdos y compromisos de aporte entre actores. Resuelve la falta de mecanismos colaborativos.'}
    ]
  },
  {
    n:4, name:['Semántica e','interoperabilidad'], tone:'green',
    title:'Semántica e interoperabilidad',
    desc:'La condición técnica que hace posible la gobernanza. Mientras cada actor describa la realidad con su propio vocabulario, el consolidado no existe. Esta capa define un vocabulario común del destino y lo expone como contrato de intercambio hacia el nodo central.',
    mods:[
      {t:'Vocabulario común', d:'Definición compartida de las entidades del destino: actor, oferta, experiencia, observación, indicador.'},
      {t:'API del nodo', d:'Contrato único de publicación y consulta. Ningún actor escribe fuera de él.'},
      {t:'Conector al nodo central', d:'Publicación hacia el ICT y retorno del consolidado nacional. Hace al destino parte de una red, no una isla.'}
    ]
  },
  {
    n:5, name:['Datos','y fuentes'], tone:'soft',
    title:'Datos y fuentes',
    desc:'El sustrato. Combina tres orígenes muy distintos: fuentes institucionales con periodicidad propia, escucha de redes sociales con consentimiento, y aportes directos de los actores del ecosistema. Cada uno entra con su ficha de procedencia, licencia y frecuencia.',
    mods:[
      {t:'Ingesta institucional', d:'IMN, OVSICORI-UNA, ICT y fuentes meteorológicas. Series de observación del destino.'},
      {t:'Escucha en redes', d:'Recuperación y normalización de experiencias publicadas fuera de la plataforma, previo consentimiento.'},
      {t:'Aportes de actores', d:'Lo que cada actor se compromete a publicar según las reglas de intercambio.'},
      {t:'Persistencia y series', d:'Almacenamiento del dato maestro y de las series temporales que alimentan los indicadores.'}
    ]
  }
];

const TONE = {
  deep:{band:'rgba(14,51,44,.07)', bandStroke:'rgba(14,51,44,.22)', chip:'#0E332C', chipStroke:'#0E332C', chipText:'#FBF6EC', num:'#0E332C'},
  teal:{band:'rgba(12,122,120,.08)', bandStroke:'rgba(12,122,120,.3)', chip:'rgba(12,122,120,.14)', chipStroke:'#0C7A78', chipText:'#0A5F5D', num:'#0C7A78'},
  gold:{band:'rgba(227,168,59,.18)', bandStroke:'#D39B1F', chip:'#FFFFFF', chipStroke:'#B9820C', chipText:'#7E5A0A', num:'#B9820C'},
  green:{band:'rgba(46,133,103,.09)', bandStroke:'rgba(46,133,103,.34)', chip:'rgba(46,133,103,.14)', chipStroke:'#2E8567', chipText:'#1F6B51', num:'#2E8567'},
  soft:{band:'rgba(92,106,98,.09)', bandStroke:'rgba(16,27,22,.2)', chip:'#FFFFFF', chipStroke:'rgba(16,27,22,.24)', chipText:'#3E4C43', num:'#5C6A62'}
};

/* parte un título de chip en 1-2 líneas */
function chipLines(t){
  if(t.length <= 17) return [t];
  const words = t.split(' ');
  let a = '', b = '';
  for(const w of words){
    if((a + ' ' + w).trim().length <= Math.ceil(t.length/2) + 3 && !b) a = (a + ' ' + w).trim();
    else b = (b + ' ' + w).trim();
  }
  return b ? [a, b] : [a];
}

function svgAltoNivel(){
  const BX = 30, BW = 1020, BH = 96, GAP = 18;
  let out = '';
  CAPAS.forEach((c, i)=>{
    const y = 30 + i*(BH+GAP);
    const t = TONE[c.tone];
    const n = c.mods.length;
    const avail = 832, cx0 = 206;
    const gap = n >= 6 ? 14 : 20;
    const cw = (avail - gap*(n-1)) / n;

    let chips = '';
    c.mods.forEach((m, j)=>{
      const x = cx0 + j*(cw+gap);
      const lines = chipLines(m.t);
      const cy = y + 20 + (56 - (lines.length-1)*13)/2 + 4;
      chips += '<g>'
        + '<rect x="'+x+'" y="'+(y+20)+'" width="'+cw.toFixed(1)+'" height="56" rx="12" fill="'+t.chip+'" stroke="'+t.chipStroke+'" stroke-width="1.2"/>'
        + svgLines(lines, x + cw/2, cy, 13, 'pt-chiptx').replace(/<text /g, '<text fill="'+t.chipText+'" ')
        + '</g>';
    });

    out += '<g class="pt-layer" data-capa="'+c.n+'">'
      + '<rect class="pt-layer-bg" x="'+BX+'" y="'+y+'" width="'+BW+'" height="'+BH+'" rx="18" fill="'+t.band+'" stroke="'+t.bandStroke+'" stroke-width="'+(c.core?2.2:1.2)+'"/>'
      + '<text x="52" y="'+(y+34)+'" class="pt-ln" fill="'+t.num+'">0'+c.n+'</text>'
      + c.name.map((l,k)=>'<text x="52" y="'+(y+56+k*15)+'" class="pt-lname">'+l+'</text>').join('')
      + (c.core ? '<text x="52" y="'+(y+88)+'" class="pt-lcore">EJE DE LA TESIS</text>' : '')
      + '<line x1="190" y1="'+(y+16)+'" x2="190" y2="'+(y+BH-16)+'" stroke="rgba(16,27,22,.14)" stroke-width="1"/>'
      + chips
      + '</g>';
  });

  /* rail transversal */
  out += '<rect x="1066" y="30" width="104" height="552" rx="18" fill="rgba(14,51,44,.05)" stroke="rgba(14,51,44,.2)" stroke-width="1.2" stroke-dasharray="6 5"/>'
    + '<line x1="1078" y1="306" x2="1158" y2="306" stroke="rgba(14,51,44,.18)" stroke-width="1"/>'
    + '<text transform="translate(1118,170) rotate(-90)" text-anchor="middle" class="pt-rail">Identidad y roles</text>'
    + '<text transform="translate(1118,444) rotate(-90)" text-anchor="middle" class="pt-rail">Trazabilidad y auditoría</text>';

  return '<svg viewBox="0 0 1200 620" role="img" aria-label="Arquitectura de alto nivel en cinco capas">'
    + '<style>'
      + '.pt-ln{font-family:"Playfair Display",serif;font-weight:900;font-size:21px}'
      + '.pt-lname{font-size:12px;font-weight:800;fill:#16211C}'
      + '.pt-lcore{font-size:8.5px;font-weight:800;letter-spacing:.8px;fill:#B9820C}'
      + '.pt-chiptx{font-size:11.5px;font-weight:700}'
      + '.pt-rail{font-size:11.5px;font-weight:800;letter-spacing:1px;fill:#0E332C}'
    + '</style>'
    + out + '</svg>';
}

  const chip = (x,y,w,h,txt,fill,stroke,tx)=>{
    const lines = chipLines(txt);
    const cy = y + (h - (lines.length-1)*12)/2 + 4;
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.1"/>'
      + svgLines(lines, x+w/2, cy, 12, '').replace(/<text /g,'<text fill="'+tx+'" font-size="10.5" font-weight="700" ');

function svgFlujo(){
  const LX = 20, LW = 150, SX0 = 180, SW = 132, SGAP = 18;
  const laneY = i => 46 + i*92, LH = 80;
  let s = '';

  FLUJO_LANES.forEach((l,i)=>{
    const y = laneY(i);
    s += '<rect x="'+LX+'" y="'+y+'" width="1200" height="'+LH+'" rx="14" fill="'+(i%2?'rgba(246,243,236,.75)':'rgba(255,255,255,.6)')+'" stroke="rgba(16,27,22,.08)"/>';
    s += '<rect x="'+LX+'" y="'+y+'" width="5" height="'+LH+'" rx="2.5" fill="'+l.c+'"/>';
    s += '<text x="'+(LX+18)+'" y="'+(y+LH/2+4)+'" class="pt-lane">'+l.t+'</text>';
  });

  const cxOf = i => SX0 + i*(SW+SGAP);
  FLUJO_PASOS.forEach((p,i)=>{
    const x = cxOf(i), y = laneY(p.lane) + 13;
    const col = FLUJO_LANES[p.lane].c;
    const cy = y + (54 - (p.t.length-1)*12)/2 + 4;
    s += '<rect x="'+x+'" y="'+y+'" width="'+SW+'" height="54" rx="12" fill="#FFFFFF" stroke="'+col+'" stroke-width="1.4"/>';
    s += '<circle cx="'+(x+12)+'" cy="'+(y-2)+'" r="10" fill="'+col+'"/>';
    s += '<text x="'+(x+12)+'" y="'+(y+2)+'" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">'+(i+1)+'</text>';
    s += svgLines(p.t, x+SW/2, cy, 12, '').replace(/<text /g,'<text fill="#2C3A34" font-size="9.8" font-weight="700" ');
  });

  FLUJO_PASOS.forEach((p,i)=>{
    if(i === FLUJO_PASOS.length-1) return;
    const nx = FLUJO_PASOS[i+1];
    const x1 = cxOf(i)+SW, x2 = cxOf(i+1);
    const y1 = laneY(p.lane)+40, y2 = laneY(nx.lane)+40;
    const mid = x1 + (x2-x1)/2;
    const d = (y1===y2)
      ? 'M'+x1+' '+y1+' H'+(x2-4)
      : 'M'+x1+' '+y1+' H'+mid+' V'+y2+' H'+(x2-4);
    s += '<path d="'+d+'" stroke="rgba(16,27,22,.35)" stroke-width="1.5" fill="none" marker-end="url(#ptArrow)"/>';
  });

  return '<svg viewBox="0 0 1240 440" role="img" aria-label="Flujo funcional del prototipo por carriles de actor">'
    + '<defs><marker id="ptArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(16,27,22,.35)"/></marker></defs>'
    + '<style>.pt-lane{font-size:11.5px;font-weight:800;fill:#16211C}</style>'
    + s + '</svg>';
}

function svgActores(){
  const cx = 610, cy = 300;
  const ring = (k,fill,stroke,dash)=>{
    const [rx,ry] = RING_GEO.draw[k];
    return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.4"'+(dash?' stroke-dasharray="7 6"':'')+'/>';
  };
  const node = (x,y,w,t,on)=>{
    const lines = chipLines(t);
    const h = lines.length > 1 ? 44 : 32;
    const ty = y - (lines.length-1)*6 + 4;
    return '<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="9" fill="'+(on?'#0E332C':'rgba(255,255,255,.9)')+'" stroke="'+(on?'#0E332C':'rgba(16,27,22,.18)')+'" stroke-width="1.1"/>'
      + svgLines(lines, x, ty, 12, '').replace(/<text /g,'<text fill="'+(on?'#FBF6EC':'#3E4C43')+'" font-size="9.8" font-weight="'+(on?'800':'700')+'" ');
  };

  let s = '';
  s += ring('intl','rgba(92,106,98,.07)','rgba(16,27,22,.2)',true);
  s += ring('nac','rgba(12,122,120,.09)','rgba(12,122,120,.32)');
  s += ring('int','rgba(46,133,103,.14)','rgba(46,133,103,.45)');

  s += '<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" class="pt-core1">Ecosistema de turismo de bienestar</text>';
  s += '<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" class="pt-core2">Destino Turístico de La Fortuna</text>';

  ['intl','nac','int'].forEach(k=>{
    const [rx,ry] = RING_GEO.band[k];
    ACTORES_MAP[k].forEach(n=>{
      const a = n.a * Math.PI / 180, m = n.r || 1;
      s += node(cx + rx*m*Math.cos(a), cy + ry*m*Math.sin(a), n.w, n.t, n.on);
    });
  });

  /* leyenda de anillos, en una fila bajo las elipses */
  const leg = [
    [28,   'rgba(46,133,103,.4)','#2E8567','Actores internos'],
    [250,  'rgba(12,122,120,.28)','#0C7A78','Actores externos nacionales'],
    [560,  'rgba(92,106,98,.22)','rgba(16,27,22,.3)','Actores externos internacionales']
  ];

    s += '<rect x="'+l[0]+'" y="598" width="13" height="13" rx="3.5" fill="'+l[1]+'" stroke="'+l[2]+'" stroke-width="1.2"/>';
    s += '<text x="'+(l[0]+22)+'" y="609" class="pt-ringlab">'+l[3]+'</text>';
  });
  s += '<text x="28" y="636" class="pt-ringnote">Resaltados en verde oscuro: actores con rol activo en el prototipo.</text>';

  return '<svg viewBox="0 0 1220 650" role="img" aria-label="Mapa de actores del ecosistema en tres anillos">'
    + '<style>'
      + '.pt-core1{font-size:13px;font-weight:800;fill:#16211C}'

      + '.pt-ringlab{font-size:10.5px;font-weight:800;fill:#3E4C43;letter-spacing:.3px}'
      + '.pt-ringnote{font-size:10px;font-weight:600;fill:#5C6A62}'

}

/* =========================================================================

function card(num, title, body, core){
  return '<div class="tc-card'+(core?' tc-card-core':'')+'">'
    + (num!=null?'<div class="tc-card-num">'+num+'</div>':'')
    + '<h4>'+title+'</h4><p>'+body+'</p></div>';
}
function cardList(num, title, items, core){
  return '<div class="tc-card'+(core?' tc-card-core':'')+'">'
    + (num!=null?'<div class="tc-card-num">'+num+'</div>':'')
    + '<h4>'+title+'</h4><ul>'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul></div>';
}
function step(n, who, title, body){
  return '<div class="pt-step"><div class="pt-step-n">'+n+'</div><div class="pt-step-b">'
    + '<h5>'+title+'</h5><p>'+body+'</p><span class="pt-step-who">'+who+'</span></div></div>';
}

/* detalle de capa */
function renderCapaDetail(n){
  const c = CAPAS.find(x=>x.n===n);

  document.getElementById('capaDetail').innerHTML =
    '<div class="pt-detail">'
    + '<div class="pt-detail-head"><span class="pt-detail-num">0'+c.n+'</span><h4>'+c.title+'</h4></div>'
    + '<p>'+c.desc+'</p>'
    + '<div class="pt-detail-grid">'
    + c.mods.map(m=>'<div class="pt-mod"><h5>'+m.t+'</h5><p>'+m.d+'</p></div>').join('')
    + '</div></div>';
  document.querySelectorAll('.pt-layer').forEach(g=>g.classList.toggle('is-sel', Number(g.dataset.capa)===n));
}

function wireArqTabs(){
  const $tabs = document.getElementById('arqTabs');
  const $body = document.getElementById('arqBody');
  function show(tab){
    $tabs.querySelectorAll('.tc-subtab').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
    $body.innerHTML = ARQ_TABS[tab]();
    if(tab === 'alto'){
      $body.querySelectorAll('.pt-layer').forEach(g=>{
        g.addEventListener('click', ()=> renderCapaDetail(Number(g.dataset.capa)));
      });
      renderCapaDetail(3);
    }
    wireFigures();
  }
  $tabs.querySelectorAll('.tc-subtab').forEach(b=>{
    b.addEventListener('click', ()=> show(b.dataset.tab));
  });
  show('alto');
}

/* lightbox de figuras */
const $lb = document.getElementById('ptLightbox');
function wireFigures(){
  $wrap.querySelectorAll('[data-lb]').forEach(f=>{
    if(f.dataset.lbWired) return;
    f.dataset.lbWired = '1';
    f.addEventListener('click', ()=>{
      $lb.querySelector('img').src = f.dataset.lb;
      $lb.classList.add('open');
    });
  });
}
$lb.addEventListener('click', ()=> $lb.classList.remove('open'));
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') $lb.classList.remove('open'); });

$list.querySelectorAll('.side-nav-item').forEach(el=>{
  el.addEventListener('click', ()=>{
    $list.querySelectorAll('.side-nav-item').forEach(o=>o.classList.remove('active'));
    el.classList.add('active');
    renderSection(el.dataset.name);
  });
});

$list.querySelector('.side-nav-item').classList.add('active');
renderSection('Presentación');
</script>
