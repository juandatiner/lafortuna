<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesis — Gobernanza Inteligente DTLF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.topbar{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:6px;background:#FFFFFF;padding:5px 10px;border-radius:999px;box-shadow:0 4px 14px rgba(5,15,13,.09);font-weight:800;color:#0E332C;font-size:11px;letter-spacing:.2px}
.brand-dot{width:6px;height:6px;border-radius:50%;background:#0C7A78;flex-shrink:0}

/* ===== Tesis content system ===== */
.tc-wrap{position:absolute;inset:0;overflow-y:auto;padding:44px 56px 72px;background:
  radial-gradient(circle at 30% 0%, rgba(10,163,160,.08) 0%, transparent 42%),
  var(--shell-base,#F6F3EC)}
.tc-eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#0C7A78;margin-bottom:10px}
.tc-title{font-family:'Playfair Display',serif;font-weight:800;font-size:1.9rem;color:#16211C;margin-bottom:16px;max-width:900px;letter-spacing:-.3px}
.tc-lead{background:linear-gradient(160deg,#0E332C 0%,#123c33 100%);color:#FBF6EC;border-radius:18px;padding:22px 26px;font-size:1rem;line-height:1.65;margin-bottom:26px;max-width:980px;box-shadow:0 14px 34px rgba(16,27,22,.18)}
.tc-lead b{color:#FFD37A}
.tc-section-label{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#16211C;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.tc-section-label:first-of-type{margin-top:0}
.tc-section-label::after{content:'';flex:1;height:1px;background:rgba(16,27,22,.12)}

.tc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:8px}
.tc-card{background:rgba(255,255,255,.7);border:1px solid rgba(16,27,22,.08);border-radius:16px;padding:15px 17px;box-shadow:0 8px 22px rgba(16,27,22,.05)}
.tc-card.tc-card-core{border-color:rgba(227,168,59,.5);background:rgba(255,247,225,.7)}
.tc-card-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#0E332C;color:#FFD37A;font-weight:800;font-size:11px;margin-bottom:9px}
.tc-card h4{font-size:.92rem;font-weight:800;color:#16211C;margin-bottom:6px;line-height:1.3}
.tc-card p{font-size:.82rem;line-height:1.5;color:#5C6A62}
.tc-card ul{margin:0;padding-left:16px;font-size:.8rem;line-height:1.6;color:#5C6A62}
.tc-card ul li::marker{color:#0C7A78}

.tc-stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:8px}
.tc-stat{background:rgba(255,255,255,.55);border:1px solid rgba(16,27,22,.08);border-radius:14px;padding:13px 15px;font-size:.82rem;line-height:1.5;color:#3E4C43}
.tc-stat b{color:#0C7A78}

.tc-callout{background:#0E332C;color:#FBF6EC;border-radius:16px;padding:17px 20px;font-size:.88rem;line-height:1.6;margin-top:10px}
.tc-callout b{color:#FFD37A}

.tc-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(12,122,120,.13);color:#0C7A78;flex-shrink:0}
.tc-tag-explicativa{background:#E3A83B;color:#16211C}


/* big non-collapsible theory cards (marco teórico) */
.tc-theory{position:relative;border:1px solid rgba(16,27,22,.08);border-radius:18px;background:rgba(255,255,255,.65);padding:16px 20px;margin-bottom:12px;box-shadow:0 8px 22px rgba(16,27,22,.05)}
.tc-theory.tc-theory-core{border-color:rgba(227,168,59,.5);background:rgba(255,247,225,.75)}
.tc-theory-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tc-theory-num{font-family:'Playfair Display',serif;font-weight:900;color:#E3A83B;font-size:.95rem;width:24px;flex-shrink:0}
.tc-theory-name{flex:1;font-weight:800;font-size:1rem;color:#16211C}
.tc-theory-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tc-theory-fields label{display:block;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#0C7A78;margin-bottom:3px}
.tc-theory-fields p{font-size:.82rem;line-height:1.5;color:#3E4C43}
.tc-theory-fields ul{margin:0;padding-left:16px;font-size:.82rem;line-height:1.55;color:#3E4C43}

/* compact meta block: objetivo general / pregunta general / pregunta específica */
.tc-meta{margin-bottom:22px;border:1px solid rgba(16,27,22,.08);border-radius:14px;background:rgba(255,255,255,.42);overflow:hidden;max-width:980px}
.tc-meta-row{display:flex;gap:16px;padding:10px 16px;border-bottom:1px solid rgba(16,27,22,.06)}
.tc-meta-row:last-child{border-bottom:none}
.tc-meta-row label{flex:0 0 150px;font-weight:800;color:#5C6A62;text-transform:uppercase;font-size:.66rem;letter-spacing:.4px;padding-top:2px}
.tc-meta-row p{flex:1;color:#3E4C43;line-height:1.5;margin:0;font-size:.82rem}

/* fase accordion (objetivos específicos) */
.tc-facc-wrap{border:1px solid rgba(16,27,22,.08);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.5)}
.tc-facc-row{border-bottom:1px solid rgba(16,27,22,.07)}
.tc-facc-row:last-child{border-bottom:none}
.tc-facc-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none}
.tc-facc-head:hover{background:rgba(255,255,255,.55)}
.tc-facc-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#0E332C;color:#FFD37A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.tc-facc-name{flex:1;font-weight:800;font-size:.94rem;color:#16211C}
.tc-facc-arrow{font-size:14px;color:#5C6A62;transition:transform .25s ease;flex-shrink:0}
.tc-facc-row.open .tc-facc-arrow{transform:rotate(90deg)}
.tc-facc-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.tc-facc-row.open .tc-facc-body{max-height:1400px}
.tc-facc-body-in{padding:6px 20px 22px 64px}

/* colorful field cards — more breathing room */
.tc-facc-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:16px}
.tc-facc-trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:16px}
.tc-facc-field{background:#fff;border-radius:16px;box-shadow:0 10px 24px rgba(16,27,22,.09);padding:18px 20px;border-left:5px solid #0C7A78}
.tc-facc-field label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#0C7A78;margin-bottom:8px}
.tc-facc-field p{font-size:.9rem;line-height:1.65;color:#2C3A34;margin:0}
.tc-facc-field.fc-objetivo{border-left-color:#E3A83B}
.tc-facc-field.fc-objetivo label{color:#B9820C}
.tc-facc-field.fc-vdir{border-left-color:#2E8567}
.tc-facc-field.fc-vdir label{color:#217056}
.tc-facc-field.fc-vind{border-left-color:#C1461F}
.tc-facc-field.fc-vind label{color:#C1461F}
.tc-facc-field.fc-vint{border-left-color:#7A5AC1}
.tc-facc-field.fc-vint label{color:#7A5AC1}
.tc-facc-field.fc-resuelve{border-left-color:#0E332C}
.tc-facc-field.fc-resuelve label{color:#0E332C}
.tc-facc-field.fc-resultado{border-left-color:#2E8567;background:rgba(46,133,103,.06)}
.tc-facc-field.fc-resultado label{color:#217056}
.tc-facc-field.fc-instrumento-plain{border-left-color:#5C6A62}
.tc-facc-field.fc-instrumento-plain label{color:#5C6A62}

/* instrumento de síntesis: eye-catching card */
.tc-facc-instrumento{margin-bottom:16px;background:linear-gradient(135deg,rgba(12,122,120,.12),rgba(227,168,59,.14));border:1.5px solid rgba(12,122,120,.4);border-radius:18px;padding:20px 22px;box-shadow:0 12px 30px rgba(12,122,120,.14)}
.tc-facc-instrumento-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tc-facc-instrumento-icon{flex-shrink:0;width:36px;height:36px;border-radius:11px;background:#0C7A78;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(12,122,120,.35)}
.tc-facc-instrumento-icon svg{width:18px;height:18px}
.tc-facc-instrumento-label{display:block;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#0C7A78}
.tc-instrumento-link{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:999px;background:linear-gradient(135deg,#0FA6A2,#0C7A78);color:#fff;font-weight:800;font-size:.9rem;text-decoration:none;border:1px solid rgba(255,255,255,.3);box-shadow:0 12px 28px rgba(12,122,120,.35);cursor:pointer}
.tc-instrumento-link:hover{background:linear-gradient(135deg,#12BAB5,#0e8f8c);transform:translateY(-2px);box-shadow:0 16px 32px rgba(12,122,120,.42)}
.tc-instrumento-link svg{width:15px;height:15px;flex-shrink:0}
.tc-instrumento-caption{margin-top:10px;font-size:.82rem;line-height:1.55;color:#3E4C43;max-width:680px}

/* observaciones: social-post style with context */
.tc-facc-obs{background:rgba(227,168,59,.08);border:1px dashed rgba(227,168,59,.4);border-radius:16px;padding:16px 18px}
.tc-facc-obs > label{display:block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#B9820C;margin-bottom:10px}
.tc-facc-obs textarea{width:100%;min-height:64px;border:1px solid rgba(16,27,22,.14);border-radius:10px;padding:9px 11px;font:inherit;font-size:.85rem;color:#16211C;background:rgba(255,255,255,.9);resize:vertical;display:block;margin-bottom:10px}
.tc-facc-obs textarea:focus{outline:2px solid rgba(12,122,120,.35);outline-offset:1px}
.tc-obs-save{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;background:#0E332C;color:#FFD37A;font-weight:800;font-size:.76rem;cursor:pointer}
.tc-obs-save:hover{background:#123c33}
.tc-obs-published{display:none;background:#fff;border-radius:14px;padding:15px 17px;box-shadow:0 8px 20px rgba(16,27,22,.09);margin-bottom:10px}
.tc-obs-post-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tc-obs-avatar{width:24px;height:24px;border-radius:50%;background:#0E332C;color:#FFD37A;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0}
.tc-obs-post-head-name{font-size:.78rem;font-weight:800;color:#16211C}
.tc-obs-post-head-role{font-size:.7rem;color:#9AA39C}
.tc-obs-published-text{font-size:.88rem;line-height:1.6;color:#16211C;white-space:pre-wrap;margin-bottom:10px}
.tc-obs-published-foot{display:flex;align-items:center;justify-content:flex-end}
.tc-obs-edit-btn{all:unset;box-sizing:border-box;font-size:.74rem;font-weight:700;color:#5C6A62;cursor:pointer;text-decoration:underline}
.tc-facc-obs.is-published textarea,.tc-facc-obs.is-published .tc-obs-save{display:none}
.tc-facc-obs.is-published .tc-obs-published{display:block}

.tc-pending{color:#9AA39C !important;font-style:italic}
.tc-facc-name.tc-pending{color:#9AA39C !important;font-style:normal;font-weight:700}

/* ===== Anexo modal ===== */
#anexoModal{position:fixed;inset:0;z-index:5000;display:none;align-items:flex-start;justify-content:center;padding:5vh 4vw;background:rgba(10,17,14,.62);backdrop-filter:blur(4px)}
#anexoModal.open{display:flex}
.anexo-card{position:relative;width:100%;max-width:1360px;max-height:90vh;overflow-y:auto;background:var(--shell-base,#F6F3EC);border-radius:22px;box-shadow:0 40px 100px rgba(0,0,0,.4);padding:32px 36px 40px}
.anexo-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;background:#0E332C;color:#FFD37A;border:none;font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
.anexo-close:hover{background:#123c33}
.anexo-eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#0C7A78;margin-bottom:8px}
.anexo-title{font-family:'Playfair Display',serif;font-weight:800;font-size:1.5rem;color:#16211C;margin-bottom:6px;max-width:760px}
.anexo-sub{font-size:.86rem;color:#5C6A62;margin-bottom:24px;max-width:760px;line-height:1.5}

/* tabla real, estilo hoja de cálculo, igual a la fuente */
.anexo-table-wrap{overflow-x:auto;border:1px solid #232D27;border-radius:2px;margin-bottom:4px}
table.anexo-table{width:100%;min-width:1180px;border-collapse:collapse;font-size:.78rem}
.anexo-table caption{caption-side:top;background:#fff;border-bottom:2px solid #232D27;padding:10px;font-weight:800;font-size:.95rem;color:#16211C;text-align:center}
.anexo-table th{background:#D9E8D3;color:#16211C;font-weight:800;font-size:.7rem;text-transform:none;letter-spacing:.1px;padding:9px 10px;border:1px solid #232D27;text-align:center;vertical-align:middle}
.anexo-table td{border:1px solid #7C8A80;padding:8px 10px;vertical-align:top;background:#fff}
.anexo-table td.anexo-td-dim{font-weight:800;background:#EFEFE3;vertical-align:middle;text-align:left}
.anexo-table td.anexo-td-var{font-weight:700;color:#16211C;white-space:normal}
.anexo-table td.anexo-td-q{font-size:.76rem;line-height:1.5;color:#2C3A34}
.anexo-table td.anexo-td-q b{display:block;font-weight:700}
.anexo-table select{width:100%;min-width:140px;padding:5px 6px;border-radius:4px;border:1px solid rgba(16,27,22,.25);background:#fff;font:inherit;font-size:.74rem;color:#16211C}
.anexo-table select + select{margin-top:5px}
.anexo-table textarea{width:100%;min-width:190px;min-height:54px;border:1px solid rgba(16,27,22,.2);border-radius:4px;padding:6px 8px;font:inherit;font-size:.75rem;color:#16211C;background:rgba(246,243,236,.6);resize:vertical}
.anexo-table textarea:focus,.anexo-table select:focus{outline:2px solid rgba(12,122,120,.4);outline-offset:1px}
.anexo-td-empty{background:#F4F4EE;color:#B7BEB6}
.anexo-td-brecha{font-weight:800;color:#16211C;text-align:center;background:#F3F0E6}
.anexo-table input[type="checkbox"]{width:15px;height:15px;vertical-align:middle;margin-top:6px}

.anexo-save-bar{position:sticky;bottom:-40px;margin:22px -36px -40px;padding:16px 36px;background:linear-gradient(0deg,var(--shell-base,#F6F3EC) 60%,transparent);display:flex;align-items:center;gap:14px}
.anexo-save-btn{all:unset;box-sizing:border-box;padding:11px 22px;border-radius:999px;background:#0E332C;color:#FFD37A;font-weight:800;font-size:.84rem;cursor:pointer}
.anexo-save-btn:hover{background:#123c33}
.anexo-save-flash{font-size:.8rem;font-weight:700;color:#0C7A78;opacity:0;transition:opacity .3s ease}
.anexo-save-flash.show{opacity:1}

.tc-subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px;max-width:980px}
.tc-subtab{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:14px 18px;border-radius:16px;border:1px solid rgba(16,27,22,.1);background:rgba(255,255,255,.55);cursor:pointer;transition:background .2s ease,transform .2s ease,box-shadow .2s ease}
.tc-subtab:hover{background:rgba(255,255,255,.85)}
.tc-subtab .tc-subtab-num{font-family:'Playfair Display',serif;font-weight:900;font-size:.78rem;color:#0C7A78}
.tc-subtab .tc-subtab-label{font-weight:800;font-size:.86rem;color:#16211C;line-height:1.25}
.tc-subtab.active{background:#0E332C;border-color:#0E332C;box-shadow:0 12px 28px rgba(16,27,22,.22);transform:translateY(-2px)}
.tc-subtab.active .tc-subtab-num{color:#FFD37A}
.tc-subtab.active .tc-subtab-label{color:#FBF6EC}

.tc-phase{display:flex;gap:14px;margin-bottom:10px;background:rgba(255,255,255,.6);border:1px solid rgba(16,27,22,.08);border-radius:14px;padding:14px 16px}
.tc-phase-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#0E332C;color:#FFD37A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px}
.tc-phase-body{flex:1;min-width:0}
.tc-phase-body h4{font-size:.88rem;font-weight:800;color:#16211C;margin-bottom:8px}
.tc-phase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tc-phase-field label{display:block;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#0C7A78;margin-bottom:3px}
.tc-phase-field p{font-size:.8rem;line-height:1.5;color:#5C6A62}
.tc-phase-simple p{font-size:.84rem;line-height:1.55;color:#5C6A62}

/* ===== Edición de contenido en vivo ===== */
.tc-edit-toggle{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;margin:0 14px 10px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid rgba(16,27,22,.12);font-weight:800;font-size:.72rem;color:#16211C;cursor:pointer;transition:background .2s ease}
.tc-edit-toggle:hover{background:rgba(255,255,255,.9)}
.tc-edit-toggle.active{background:#0E332C;color:#FFD37A;border-color:#0E332C}
.side-nav.collapsed .tc-edit-toggle{width:30px;height:30px;padding:0;margin:0 auto 10px}
.side-nav.collapsed .tc-edit-toggle-text{display:none}
.tc-edit-exit-row{display:none;flex-direction:column;gap:8px;margin:0 14px 10px}
.tc-edit-exit-row .tc-edit-toggle{margin:0}
.tc-edit-save-exit{background:#0E332C;color:#FFD37A;border-color:#0E332C}
.tc-edit-save-exit:hover{background:#123c33}
.tc-edit-cancel-exit{background:rgba(214,69,69,.1);color:#B33F3F;border-color:rgba(214,69,69,.35)}
.tc-edit-cancel-exit:hover{background:rgba(214,69,69,.18)}
body.editing-content #editToggleBtn{display:none}
body.editing-content .tc-edit-exit-row{display:flex}
.side-nav.collapsed .tc-edit-exit-row{flex-direction:row}
.side-nav.collapsed .tc-edit-exit-row .tc-edit-toggle{width:30px;height:30px;padding:0}
body.editing-content [data-ekey]{position:relative;cursor:pointer;outline:1.5px dashed rgba(12,122,120,.45);outline-offset:3px;border-radius:6px;transition:background .15s ease}
body.editing-content [data-ekey]:hover{outline-color:#0C7A78;background:rgba(12,122,120,.07)}
body.editing-content [data-ekey]:hover::after{content:'✎';position:absolute;top:-11px;right:-11px;width:20px;height:20px;border-radius:50%;background:#0E332C;color:#FFD37A;font-size:11px;line-height:20px;text-align:center;box-shadow:0 4px 10px rgba(16,27,22,.3);pointer-events:none}
.tc-ebox{border:1.5px solid rgba(12,122,120,.55);border-radius:10px;padding:10px;background:#fff;outline:none !important}
.tc-ebox textarea{width:100%;min-height:74px;border:1px solid rgba(16,27,22,.16);border-radius:8px;padding:8px 10px;font:inherit;font-size:.85rem;color:#16211C;resize:vertical;margin-bottom:8px;display:block}
.tc-ebox textarea:focus{outline:2px solid rgba(12,122,120,.35);outline-offset:1px}
.tc-ebox-actions{display:flex;gap:8px}
.tc-ebox-save{all:unset;box-sizing:border-box;padding:6px 14px;border-radius:999px;background:#0E332C;color:#FFD37A;font-weight:800;font-size:.74rem;cursor:pointer}
.tc-ebox-save:hover{background:#123c33}
.tc-ebox-cancel{all:unset;box-sizing:border-box;padding:6px 14px;border-radius:999px;background:rgba(16,27,22,.08);color:#16211C;font-weight:700;font-size:.74rem;cursor:pointer}
.tc-ebox-cancel:hover{background:rgba(16,27,22,.14)}

/* barrita flotante de formato de texto (negrita, subrayado, color...) */
.tc-rte-toolbar{position:sticky;top:-2px;z-index:2;display:flex;align-items:center;gap:3px;flex-wrap:wrap;background:#0E332C;border-radius:999px;padding:6px 9px;margin-bottom:8px;box-shadow:0 8px 20px rgba(14,51,44,.4)}
.tc-rte-btn{all:unset;box-sizing:border-box;width:25px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:#FBF6EC;font-size:.78rem;cursor:pointer}
.tc-rte-btn:hover{background:rgba(255,255,255,.16)}
.tc-rte-btn.active{background:#FFD37A;color:#0E332C}

<script>
document.querySelectorAll('[data-nav-toggle]').forEach(btn=>{

/* ===================== CONTENIDO EDITABLE ===================== */

const EDIT_KEY_LOCAL = '2026'; // mismo código que access-gate.js; sirve solo de filtro liviano, la clave real la valida el server
const MAX_UPLOAD_MB = 20;
let OVERRIDES = {};

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function nl2html(s){
  if(!s) return '';
  return escHtml(s).split(/\n{2,}/).map(p=>p.replace(/\n/g,'<br>')).join('<br><br>');
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent || '';
}

/* ===== editor de texto enriquecido (negrita, subrayado, color, resaltado...) ===== */
const RTE_COLORS = ['#FFFFFF','#16211C','#0C7A78','#D64545','#E3A83B','#2E5AAC','#7A3E9D','#1E7A34','#C2661E','#B23A6D','#0E7490','#6B4226','#5B6470'];
const RICH_TAG_RE = /<(b|strong|i|em|u|s|strike|span|br)[ >/]/i;
/* valores viejos (texto plano guardado antes de este editor) siguen escapándose + saltos de línea;
   valores nuevos (html ya saneado por sanitizeRichHtml) se inyectan directo */
function renderStoredHtml(v){
  if(!v) return '';
  return RICH_TAG_RE.test(v) ? v : nl2html(v);
}
function sanitizeRichHtml(html){
  const ALLOWED = { B:1, STRONG:1, I:1, EM:1, U:1, S:1, STRIKE:1, SPAN:1, BR:1 };
  /* tags peligrosos: se eliminan enteros (con su contenido), nunca se "desenvuelven" */
  const DENY = { SCRIPT:1, STYLE:1, IFRAME:1, OBJECT:1, EMBED:1, LINK:1, META:1, SVG:1, IMG:1, VIDEO:1, AUDIO:1, FORM:1, INPUT:1, BUTTON:1, SOURCE:1, TRACK:1 };
  const root = document.createElement('div');
  root.innerHTML = html;
  (function clean(node){
    Array.from(node.childNodes).forEach(child=>{
      if(child.nodeType === 3) return;
      if(child.nodeType !== 1){ node.removeChild(child); return; }
      if(DENY[child.tagName]){ node.removeChild(child); return; }
      /* Chrome usa <font color> (legado) para el color de texto: se convierte a <span style="color:..."> */
      if(child.tagName === 'FONT'){
        const span = document.createElement('span');
        const color = child.style.color || child.getAttribute('color');
        const bg = child.style.backgroundColor;
        if(color) span.style.color = color;
        if(bg) span.style.backgroundColor = bg;
        while(child.firstChild) span.appendChild(child.firstChild);
        node.replaceChild(span, child);
        child = span;
      }
      const tag = child.tagName;
      if(tag === 'DIV' || tag === 'P'){
        node.insertBefore(document.createElement('br'), child);
        while(child.firstChild) node.insertBefore(child.firstChild, child);
        node.removeChild(child);
        return;
      }
      if(!ALLOWED[tag]){
        while(child.firstChild) node.insertBefore(child.firstChild, child);
        node.removeChild(child);
        return;
      }
      Array.from(child.attributes).forEach(attr=>{
        if(tag === 'SPAN' && attr.name === 'style'){
          const parts = [];
          if(child.style.color) parts.push('color:'+child.style.color);
          if(child.style.backgroundColor) parts.push('background-color:'+child.style.backgroundColor);
          if(parts.length) child.setAttribute('style', parts.join(';')); else child.removeAttribute('style');
        } else {
          child.removeAttribute(attr.name);
        }
      });
      clean(child);
    });
  })(root);
  return root.innerHTML.trim().replace(/^(<br>)+/i,'').replace(/(<br>)+$/i,'');
}
function richToolbarHtml(){
  return `<div class="tc-rte-toolbar">
    <button type="button" class="tc-rte-btn" data-cmd="bold" title="Negrita"><b>B</b></button>
    <button type="button" class="tc-rte-btn" data-cmd="italic" title="Cursiva"><i>I</i></button>
    <button type="button" class="tc-rte-btn" data-cmd="underline" title="Subrayado"><u>S</u></button>
    <button type="button" class="tc-rte-btn" data-cmd="strikeThrough" title="Tachado"><s>T</s></button>
    <span class="tc-rte-sep"></span>
    ${RTE_COLORS.map(c=>`<button type="button" class="tc-rte-swatch" data-color="${c}" style="background:${c}" title="Color de texto"></button>`).join('')}
    <span class="tc-rte-sep"></span>
    <button type="button" class="tc-rte-btn" data-cmd="hilite" title="Resaltar">🖍</button>
    <button type="button" class="tc-rte-btn tc-rte-clear" data-cmd="removeFormat" title="Quitar formato">Quitar</button>
  </div>`;
}
function wireRte(scope){
  const toolbar = scope.querySelector('.tc-rte-toolbar');
  const editable = scope.querySelector('.tc-rte');
  if(!toolbar || !editable) return editable;
  try{ document.execCommand('defaultParagraphSeparator', false, 'br'); }catch(e){}
  /* botones de negrita/cursiva/subrayado/tachado se marcan "activos" según el cursor:
     volver a pulsarlos quita solo ese formato (no hace falta usar "Quitar formato") */
  const toggleBtns = Array.from(toolbar.querySelectorAll('[data-cmd="bold"],[data-cmd="italic"],[data-cmd="underline"],[data-cmd="strikeThrough"]'));
  function updateActiveState(){
    toggleBtns.forEach(btn=>{
      let on = false;
      try{ on = document.queryCommandState(btn.dataset.cmd); }catch(e){}
      btn.classList.toggle('active', on);
    });
  }
  editable.addEventListener('keyup', updateActiveState);
  editable.addEventListener('mouseup', updateActiveState);
  editable.addEventListener('focus', updateActiveState);
  editable.addEventListener('paste', (e)=>{
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  toolbar.querySelectorAll('[data-cmd]').forEach(btn=>{
    btn.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      editable.focus();
      const cmd = btn.dataset.cmd;
      if(cmd === 'hilite') document.execCommand('hiliteColor', false, '#FCE98A');
      else document.execCommand(cmd);
      updateActiveState();
    });
  });
  toolbar.querySelectorAll('.tc-rte-swatch').forEach(sw=>{
    sw.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      editable.focus();
      document.execCommand('foreColor', false, sw.dataset.color);
    });
  });
  return editable;
}
function edAttr(key, kind){ return `data-ekey="${key}" data-ekind="${kind||'text'}"`; }
function EK(key, fallback){
  const v = OVERRIDES[key];
  return (v===undefined || v===null || v==='') ? fallback : renderStoredHtml(v);
}
function EKlist(key, fallbackArr){
  const v = OVERRIDES[key];
  return Array.isArray(v) ? v.map(escHtml) : fallbackArr;
}

async function loadOverrides(){
  try{
    const res = await fetch('/api/content');
    if(res.ok) OVERRIDES = await res.json();
  }catch(e){}
}
async function saveKey(key, value){
  OVERRIDES[key] = value;
  try{
    const res = await fetch('/api/content', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Edit-Key':EDIT_KEY_LOCAL},
      body: JSON.stringify({key, value})
    });
    if(!res.ok) throw new Error('save failed');
    return true;
  }catch(e){
    alert('No se pudo guardar. Revisá la conexión e intentá de nuevo.');
    return false;
  }
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(String(r.result).split(',')[1] || '');
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function uploadAttachment(key, kind, file){
  if(file.size > MAX_UPLOAD_MB * 1024 * 1024){
    alert(`Archivo demasiado grande. Máx. ${MAX_UPLOAD_MB} MB por archivo.`);
    return false;
  }
  let dataBase64;
  try{ dataBase64 = await fileToBase64(file); }
  catch(e){ alert('No se pudo leer el archivo.'); return false; }
  try{
    const res = await fetch('/api/upload', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Edit-Key':EDIT_KEY_LOCAL},
      body: JSON.stringify({ key, kind, filename:file.name, mime:file.type, dataBase64 })
    });
    const data = await res.json();
    if(!res.ok){ alert(data.error || 'No se pudo subir el archivo.'); return false; }
    OVERRIDES[key+'.attach'] = data.attach;
    return true;
  }catch(e){
    alert('No se pudo subir el archivo. Revisá la conexión.');
    return false;
  }
}
async function removeAttachment(key, kind){
  try{
    const res = await fetch('/api/attach', {
      method:'DELETE',
      headers:{'Content-Type':'application/json','X-Edit-Key':EDIT_KEY_LOCAL},
      body: JSON.stringify({ key, kind })
    });
    const data = await res.json();
    if(!res.ok){ alert(data.error || 'No se pudo quitar el archivo.'); return false; }
    OVERRIDES[key+'.attach'] = data.attach;
    return true;
  }catch(e){
    alert('No se pudo quitar el archivo. Revisá la conexión.');
    return false;
  }
}
function attachControlsHtml(key){
  const rec = OVERRIDES[key+'.attach'] || {};
  return `<div class="tc-ebox-attach">
    <div class="tc-attach-row">
      <label class="tc-attach-input">📷 ${rec.image ? 'Cambiar imagen' : 'Imagen'}<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-attach-kind="image"></label>
      <label class="tc-attach-input">📄 ${rec.doc ? 'Cambiar documento' : 'Documento'}<input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv" data-attach-kind="doc"></label>
    </div>
    ${rec.image ? `<div class="tc-attach-row">

      <span class="tc-attach-name" title="${escHtml(rec.image.name)}">${escHtml(rec.image.name)}</span>

    </div>` : ''}

}
function wireAttachControls(panel, key, onChange){
  panel.querySelectorAll('input[type=file]').forEach(inp=>{
    inp.addEventListener('click', e=> e.stopPropagation());
    inp.addEventListener('change', async ()=>{
      const file = inp.files[0];
      if(!file) return;
      const ok = await uploadAttachment(key, inp.dataset.attachKind, file);
      if(ok) onChange();
    });
  });
  panel.querySelectorAll('.tc-attach-remove').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ok = await removeAttachment(key, btn.dataset.attachKind);
      if(ok) onChange();
    });
  });
}
/* monta los controles de adjuntar imagen/documento dentro de un panel .tc-ebox de edición inline */
function mountAttachControls(panelEl, key){
  function refresh(){
    const holder = panelEl.querySelector('.tc-ebox-attach');
    holder.outerHTML = attachControlsHtml(key);
    wireAttachControls(panelEl, key, refresh);
  }
  refresh();
}

/* ---- grupo de cajas con + / papelera (largo variable, ej. estado del arte) ---- */
const GROUP_DEFAULTS = {};
/* categorías nuevas del marco teórico (agregadas por el usuario) arrancan con las mismas
   4 preguntas base que las categorías fijas, bloqueadas igual que el resto */
const QA_BASE_DEFAULT = [
  { q:'¿Qué es?', a:'' },
  { q:'¿Por qué?', a:'' },
  { q:'¿Cómo?', a:'' },
  { q:'Aporte', a:'' }
];
function groupItems(key){
  const v = OVERRIDES[key];
  if(Array.isArray(v)) return v.slice();
  if(GROUP_DEFAULTS[key]) return GROUP_DEFAULTS[key].slice();
  if(/^mtx\d+\.fields$/.test(key)) return QA_BASE_DEFAULT.map(it=>({...it}));
  return [];
}

/* ---- grupo tipo "stat": item = string html ---- */
function statGroupInner(key){
  const items = groupItems(key);
  return items.map((html,i)=>`<div class="tc-stat" data-gi="${i}">${html}<button type="button" class="tc-box-del" title="Eliminar">&minus;</button></div>`).join('')

/* ---- grupo tipo "card": item = {title, desc} ---- */
function chipGroupInner(key){

/* ---- grupo tipo "qa": item = {q, a} (preguntas del marco teórico) ----
   las primeras 4 preguntas (¿Qué es?, ¿Por qué?, ¿Cómo?, Aporte) son la estructura base:
   no se pueden borrar ni renombrar, solo se les puede cambiar la descripción (a) */
function qaGroupInner(key){
  const items = groupItems(key);
  return items.map((it,i)=>{
    const locked = i < 4;
    return `<div class="tc-theory-qa" data-gi="${i}">
      ${locked ? '' : `<button type="button" class="tc-box-del" title="Eliminar">&minus;</button>`}
      <label data-gfield="q"${locked ? ' data-locked="1"' : ''}>${escHtml(it.q||'')}</label>
      <p data-gfield="a">${it.a ? renderStoredHtml(it.a) : `<span class="tc-pending">${PENDING}</span>`}</p>
    </div>`;
  }).join('')
    + `<button type="button" class="tc-box-add" data-add-group="${key}">+ Agregar pregunta</button>`;
}

/* ---- grupo tipo "theory": categorías extra del marco teórico agregadas por el usuario.
   las categorías fijas (mt1..mt13) no viven en este grupo y nunca se pueden borrar. */
function theoryExtraGroupInner(key){
  const items = groupItems(key);
  return items.map((it,i)=>{
    const fieldsKey = 'mtx' + it.id + '.fields';
    return `<div class="tc-theory" data-gi="${i}">
      <button type="button" class="tc-box-del" title="Eliminar">&minus;</button>

/* ---- contenido largo: clamp + overlay "ver más" ---- */
const CLAMP_MAX = 140;
function applyClamp(el){
  if(el.classList.contains('tc-ebox-active')) return;
  if(el.querySelector(':scope > .tc-eclamp-inner')) return;
  if(el.scrollHeight <= CLAMP_MAX + 26) return;
  const delBtn = el.querySelector(':scope > .tc-box-del');
  const inner = document.createElement('div');
  inner.className = 'tc-eclamp-inner';
  Array.from(el.childNodes).forEach(n=>{ if(n !== delBtn) inner.appendChild(n); });
  el.prepend(inner);
  const footer = document.createElement('div');
  footer.className = 'tc-clamp-footer';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tc-ver-mas';
  btn.innerHTML = 'Ver más <span aria-hidden="true">&rarr;</span>';
  btn.addEventListener('click', (e)=>{ e.stopPropagation(); openViewMore(el); });
  footer.appendChild(btn);
  inner.after(footer);
}
function wireClamps(root){
  root.querySelectorAll('[data-ekey]').forEach(applyClamp);
  root.querySelectorAll('[data-group-key] [data-gi]').forEach(applyClamp);
  root.querySelectorAll('[data-group-key] [data-gfield]').forEach(applyClamp);
}

/* ---- adjuntos: imagen/documento anclados a un campo ---- */
function attachKeyFor(el){
  if(el.dataset.ekey) return el.dataset.ekey;
  const container = el.closest('[data-group-key]');
  if(!container) return null;
  if(el.dataset.gfield){
    const itemEl = el.closest('[data-gi]');
    return container.dataset.groupKey + '#' + itemEl.dataset.gi + '.' + el.dataset.gfield;
  }
  if(el.dataset.gi !== undefined) return container.dataset.groupKey + '#' + el.dataset.gi;
  return null;
}
function cleanContentHtml(el){
  const clone = el.cloneNode(true);
  clone.querySelectorAll(':scope > .tc-clamp-footer, :scope > .tc-attach-badge, :scope > .tc-box-del').forEach(n=>n.remove());
  const inner = clone.querySelector(':scope > .tc-eclamp-inner');
  return inner ? inner.innerHTML : clone.innerHTML;
}

  if(document.body.classList.contains('editing-content')){
    wireAttachControls(wrap, key, ()=>{ renderAttachSection(modal, key, el); applyAttachBadge(el); });
  }

function openViewMore(el){
  const key = attachKeyFor(el);
  const modal = document.getElementById('vmModal');
  modal.querySelector('.vm-body').innerHTML = cleanContentHtml(el);
  if(key) renderAttachSection(modal, key, el);
  else modal.querySelector('.vm-attach').innerHTML = '';
  modal.classList.add('open');
}
function closeViewMore(){ document.getElementById('vmModal').classList.remove('open'); }

function selectField(cls, label, options, value){
  return `<div class="anexo-select-field ${cls}"><label>${label}</label>
    <select>${options.map(o=>`<option value="${o.v}"${o.v===value?' selected':''}>${o.l}</option>`).join('')}</select>
  </div>`;
}

function fieldSelect(field, options, value){
  return `<select data-field="${field}">${options.map(o=>`<option value="${o.v}"${o.v===value?' selected':''}>${o.l}</option>`).join('')}</select>`;
}
function fieldTextarea(field, placeholder, value){
  return `<textarea data-field="${field}" placeholder="${placeholder}">${value || ''}</textarea>`;
}
function fieldCheckbox(field, checked){
  return `<input type="checkbox" data-field="${field}"${checked ? ' checked' : ''}>`;
}

function renderMatrixBody(a, saved){
  let vi = 0;
  const rows = a.dimensiones.map(d => d.vars.map((v,vIdxInDim)=>{
    const idx = vi++;
    const s = saved[idx] || {};
    const [q1, ...qRest] = v.q.split(' — ');
    return `<tr data-vi="${idx}">
      ${vIdxInDim===0 ? `<td class="anexo-td-dim" rowspan="${d.vars.length}">${d.name}</td>` : ''}
      <td class="anexo-td-var">${v.t}</td>
      <td class="anexo-td-q"><b>${q1}</b>${qRest.length ? `— ${qRest.join(' — ')}` : ''}</td>
      <td>${fieldSelect('nivel', NIVEL_DESARROLLO, s.nivel)}</td>
      <td class="${v.coordinacion ? '' : 'anexo-td-empty'}">${v.coordinacion ? fieldSelect('coord', MODELO_COORD, s.coord) : '—'}</td>
      <td>${fieldSelect('incidencia', TIPO_INCIDENCIA, s.incidencia)}</td>
      <td>${fieldTextarea('texto', 'Observaciones, comparaciones, elementos concluyentes...', s.texto)}</td>
    </tr>`;
  }).join('')).join('');
  return { rows, head:`
    <th style="width:13%">Dimensión</th>
    <th style="width:13%">Variable de análisis</th>
    <th style="width:24%">Evidencia documental<br>(qué analiza / pregunta guía)</th>
    <th style="width:11%">Nivel de desarrollo (0-3)</th>
    <th style="width:13%">Modelo de coordinación — Nivel de desarrollo</th>
    <th style="width:11%">Tipo de incidencia en la gobernanza</th>
    <th style="width:15%">Observaciones, comparaciones, elementos concluyentes</th>
  `};
}

function renderMadurezBody(a, saved){
  let vi = 0;
  const rows = a.dimensiones.map(d => {
    const totalInds = d.subs.reduce((n,s)=>n+s.inds.length,0);
    let firstInDim = true;
    return d.subs.map(sub => sub.inds.map((ind,indIdx)=>{
      const idx = vi++;
      const s = saved[idx] || {};
      const tds = [];
      if(firstInDim){ tds.push(`<td class="anexo-td-dim" rowspan="${totalInds}">${d.name}</td>`); firstInDim = false; }
      if(indIdx===0){ tds.push(`<td class="anexo-td-var" rowspan="${sub.inds.length}">${sub.name}</td>`); }
      tds.push(`<td class="anexo-td-q">${ind}</td>`);
      tds.push(`<td>${fieldSelect('nivel', MADUREZ_SCALE, s.nivel)}</td>`);
      return `<tr data-vi="${idx}">${tds.join('')}</tr>`;
    }).join('')).join('');
  }).join('');
  return { rows, head:`
    <th style="width:20%">Dimensión</th>
    <th style="width:22%">Subdimensión</th>
    <th style="width:38%">Indicadores</th>
    <th style="width:20%">Escala de madurez (0-4)</th>
  `};
}

function computeBrecha(actual, ideal){
  if(!actual || !ideal) return { txt:'—', cls:'' };
  const b = Number(ideal) - Number(actual);
  let label = 'sin brecha';
  if(b > 2) label = 'crítica';
  else if(b === 2) label = 'significativa';
  else if(b === 1) label = 'moderada';
  return { txt:`${b} — ${label}`, cls:'' };
}
function renderBrechasBody(a, saved){
  let vi = 0;
  const rows = a.dimensiones.map(d => d.criterios.map((c,cIdx)=>{
    const idx = vi++;
    const s = saved[idx] || {};
    const brecha = computeBrecha(s.actual, s.ideal);
    return `<tr data-vi="${idx}">
      ${cIdx===0 ? `<td class="anexo-td-dim" rowspan="${d.criterios.length}">${d.name}</td>` : ''}
      <td class="anexo-td-var">${c}</td>
      <td>${fieldSelect('actual', ESTADO_SCALE, s.actual)}</td>
      <td>${fieldSelect('ideal', ESTADO_SCALE, s.ideal)}</td>
      <td class="anexo-td-brecha">${brecha.txt}</td>
      <td>${fieldSelect('prioridad', PRIORIDAD_SCALE, s.prioridad)}</td>
      <td>${fieldTextarea('accion', 'Acción estratégica sugerida...', s.accion)}</td>
    </tr>`;
  }).join('')).join('');
  return { rows, head:`
    <th style="width:14%">Dimensión</th>
    <th style="width:18%">Criterio de evaluación</th>
    <th style="width:11%">Estado actual</th>
    <th style="width:11%">Estado ideal</th>
    <th style="width:13%">Brecha identificada</th>
    <th style="width:11%">Prioridad</th>
    <th style="width:22%">Acción estratégica sugerida</th>
  `};
}

const ANEXO_RENDERERS = { matrix:renderMatrixBody, madurez:renderMadurezBody, comparativo:renderComparativoBody, brechas:renderBrechasBody };

function renderAnexo(id){
  const a = ANEXOS[id];
  if(!a.dimensiones.length){
    return `
      <div class="anexo-eyebrow">${a.eyebrow}</div>
      <div class="anexo-title">${a.title}</div>
      <p style="color:#9AA39C;font-style:italic;font-size:.9rem">Contenido en construcción.</p>
    `;
  }
  const saved = (OVERRIDES['tesis_' + a.key] && typeof OVERRIDES['tesis_' + a.key] === 'object') ? OVERRIDES['tesis_' + a.key] : {};
  const { rows, head } = ANEXO_RENDERERS[a.type](a, saved);
  return `
    <div class="anexo-eyebrow">${a.eyebrow}</div>
    <div class="anexo-title">${a.title}</div>
    <div class="anexo-sub">${a.sub}</div>
    <div class="anexo-table-wrap">
      <table class="anexo-table">
        <thead><tr>${head}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="anexo-save-bar">
      <button type="button" class="anexo-save-btn" data-anexo-save="${id}">Guardar anexo</button>
      <span class="anexo-save-flash" id="anexoSaveFlash">Guardado ✓</span>
    </div>
  `;
}

function wireBrechaCompute(){
  document.querySelectorAll('.anexo-table tr[data-vi]').forEach(row=>{
    const actualSel = row.querySelector('[data-field="actual"]');
    const idealSel = row.querySelector('[data-field="ideal"]');
    const brechaCell = row.querySelector('.anexo-td-brecha');
    if(!actualSel || !idealSel || !brechaCell) return;
    function update(){ brechaCell.textContent = computeBrecha(actualSel.value, idealSel.value).txt; }
    actualSel.addEventListener('change', update);
    idealSel.addEventListener('change', update);
  });
}

function openAnexo(id){
  document.getElementById('anexoBody').innerHTML = renderAnexo(id);
  document.getElementById('anexoModal').classList.add('open');
  wireBrechaCompute();
  const saveBtn = document.querySelector(`[data-anexo-save="${id}"]`);
  if(!saveBtn) return;
  saveBtn.addEventListener('click', async ()=>{
    const a = ANEXOS[id];
    const data = {};
    document.querySelectorAll('.anexo-table tr[data-vi]').forEach(row=>{
      const obj = {};
      row.querySelectorAll('[data-field]').forEach(el=>{
        obj[el.dataset.field] = el.type === 'checkbox' ? el.checked : el.value;
      });
      data[row.dataset.vi] = obj;
    });
    const ok = await saveKey('tesis_' + a.key, data);
    if(!ok) return;
    const flash = document.getElementById('anexoSaveFlash');
    flash.classList.add('show');
    setTimeout(()=> flash.classList.remove('show'), 1800);
  });
}
function closeAnexo(){
  document.getElementById('anexoModal').classList.remove('open');
}
document.getElementById('anexoModal').addEventListener('click', (e)=>{
  if(e.target.id === 'anexoModal') closeAnexo();
});
document.querySelector('[data-anexo-close]').addEventListener('click', closeAnexo);
document.getElementById('vmModal').addEventListener('click', (e)=>{
  if(e.target.id === 'vmModal') closeViewMore();
});
document.querySelector('[data-vm-close]').addEventListener('click', closeViewMore);
document.getElementById('attachPreview').addEventListener('click', (e)=>{
  if(e.target.id === 'attachPreview') closeAttachPreview();
});
document.querySelector('[data-ap-close]').addEventListener('click', closeAttachPreview);
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && document.getElementById('attachPreview').classList.contains('open')) closeAttachPreview();
});
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-anexo-id]');
  if(btn) openAnexo(btn.dataset.anexoId);
});

  return `<div class="tc-facc-field ${cls}"><label>${label}</label><p ${edAttr(key)}>${orPending(EK(key, text))}</p></div>`;

function renderObjetivo(name){
  const o = OBJ_DATA[name];
  const objKey = name.toLowerCase().replace(/\s+/g,'');
  const subVal = EK(objKey+'.sub', o.sub);
  const preguntaVal = EK(objKey+'.pregunta', o.pregunta);
  const statementVal = EK(objKey+'.statement', o.statement);
  return `
    <div class="tc-eyebrow">${name}: proceso de investigación</div>
    <div class="tc-title${subVal?'':' tc-pending'}" ${edAttr(objKey+'.sub')}>${subVal || name}</div>
    <div class="tc-meta">
      <div class="tc-meta-row"><label>Objetivo general</label><p ${edAttr('meta.objetivoGeneral')}>${EK('meta.objetivoGeneral', OBJETIVO_GENERAL_TXT)}</p></div>
      <div class="tc-meta-row"><label>Pregunta general</label><p ${edAttr('meta.preguntaGeneral')}>${EK('meta.preguntaGeneral', PREGUNTA_GENERAL_TXT)}</p></div>
      <div class="tc-meta-row"><label>Pregunta específica</label><p ${edAttr(objKey+'.pregunta')}>${orPending(preguntaVal)}</p></div>
      <div class="tc-meta-row"><label>${name} específico</label><p ${edAttr(objKey+'.statement')}>${orPending(statementVal)}</p></div>
    </div>
    <div class="tc-section-label">Fases del proceso</div>
    ${renderFaseAccordion(objKey, o.fases, name, o)}
    ${o.resultadosGenerales ? `<div class="tc-section-label">Resultados generales del objetivo</div>${cardList(objKey+'.resultados', null,'Resultados', o.resultadosGenerales)}` : ''}
    ${o.extra ? `<div class="tc-section-label">${o.extra.t}</div>${cardList(objKey+'.extra', null, o.extra.t, o.extra.b)}` : ''}
    <div class="tc-callout" ${edAttr(objKey+'.aporte')}><b>Aporte de ${name.toLowerCase()}:</b> ${EK(objKey+'.aporte', o.aporte)}</div>
  `;
}
function wireObjetivoAccordion(){
  $wrap.querySelectorAll('.tc-facc-head').forEach(h=>{
    h.addEventListener('click', ()=> h.closest('.tc-facc-row').classList.toggle('open'));
  });
  $wrap.querySelectorAll('.tc-facc-obs').forEach(box=>{
    const key = box.dataset.obsKey;
    const ta = box.querySelector('textarea');
    const saveBtn = box.querySelector('.tc-obs-save');
    const editBtn = box.querySelector('.tc-obs-edit-btn');
    const publishedText = box.querySelector('.tc-obs-published-text');
    function showPublished(text){
      publishedText.textContent = text;
      box.classList.add('is-published');
    }
    const saved = typeof OVERRIDES[key] === 'string' ? OVERRIDES[key] : null;
    if(saved){ ta.value = saved; showPublished(saved); }
    saveBtn.addEventListener('click', async ()=>{
      const val = ta.value.trim();
      if(!val) return;
      const ok = await saveKey(key, val);
      if(!ok) return;
      showPublished(val);
    });
    editBtn.addEventListener('click', ()=>{
      box.classList.remove('is-published');
      ta.focus();
    });
  });
}

const $editToggle = document.getElementById('editToggleBtn');

const $editKeyError = document.getElementById('editKeyError');
function openEditKeyModal(){
  $editKeyError.classList.remove('show');
  $editKeyInput.value = '';
  $editKeyModal.classList.add('open');
  setTimeout(()=> $editKeyInput.focus(), 50);
}
function closeEditKeyModal(){
  $editKeyModal.classList.remove('open');
}
function submitEditKey(){
  if($editKeyInput.value !== EDIT_KEY_LOCAL){
    $editKeyError.classList.add('show');
    $editKeyInput.focus();
    return;
  }
  closeEditKeyModal();
  document.body.classList.add('editing-content');
  $editToggle.classList.add('active');
}
$editToggle.addEventListener('click', openEditKeyModal);

document.getElementById('editKeyCancel').addEventListener('click', closeEditKeyModal);
document.querySelector('[data-ek-close]').addEventListener('click', closeEditKeyModal);
$editKeyInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submitEditKey(); });
$editKeyModal.addEventListener('click', (e)=>{ if(e.target.id === 'editKeyModal') closeEditKeyModal(); });
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && $editKeyModal.classList.contains('open')) closeEditKeyModal();
});

/* si queda una caja en edición abierta, la resuelve (guarda o descarta) antes de salir del modo edición */
async function resolveOpenEditors(mode){
  const openEls = Array.from(document.querySelectorAll('.tc-ebox-active'));
  for(const el of openEls){
    if(mode === 'save' && typeof el._eboxSave === 'function') await el._eboxSave();
    else if(mode === 'cancel' && typeof el._eboxCancel === 'function') el._eboxCancel();
  }
}
function exitEditingMode(){
  document.body.classList.remove('editing-content');
  $editToggle.classList.remove('active');
}
document.getElementById('editSaveExitBtn').addEventListener('click', async (e)=>{
  e.stopPropagation();
  await resolveOpenEditors('save');
  exitEditingMode();
});
document.getElementById('editCancelExitBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  resolveOpenEditors('cancel');
  exitEditingMode();
});

$wrap.addEventListener('click', (e)=>{
  if(!document.body.classList.contains('editing-content')) return;
  const delBtn = e.target.closest('.tc-box-del');
  if(delBtn){
    e.stopPropagation();
    const itemEl = delBtn.closest('[data-gi]');
    const container = delBtn.closest('[data-group-key]');
    const key = container.dataset.groupKey;
    const items = groupItems(key);
    items.splice(Number(itemEl.dataset.gi), 1);
    saveKey(key, items).then(ok=>{ if(ok){ renderGroupInPlace(container); flashSaved(); } });
    return;
  }
  const addBtn = e.target.closest('.tc-box-add');
  if(addBtn){
    e.stopPropagation();
    const container = addBtn.closest('[data-group-key]');
    const key = container.dataset.groupKey;
    const kind = container.dataset.groupKind;
    const items = groupItems(key);
    items.push(GROUP_NEW_ITEM[kind]());
    saveKey(key, items).then(ok=>{ if(ok){ renderGroupInPlace(container); flashSaved(); } });
    return;
  }
  if(e.target.closest('.tc-ebox')) return;
  if(e.target.closest('.tc-ver-mas')) return;
  if(e.target.closest('button, a')) return;
  const gfieldEl = e.target.closest('[data-group-key] [data-gfield]');
  if(gfieldEl){
    if(gfieldEl.dataset.locked === '1') return;
    if(!gfieldEl.classList.contains('tc-ebox-active')) enterCardFieldEdit(gfieldEl);
    return;
  }
  const groupItem = e.target.closest('[data-group-key] [data-gi]');
  if(groupItem){
    const kind = groupItem.closest('[data-group-key]').dataset.groupKind;
    if(kind === 'stat' && !groupItem.classList.contains('tc-ebox-active')) enterGroupItemEdit(groupItem);
    return;
  }
  const box = e.target.closest('[data-ekey]');
  if(box && !box.classList.contains('tc-ebox-active')) enterEdit(box);
});

loadOverrides().then(()=>{
  $list.querySelector('.side-nav-item').classList.add('active');
  renderSection('Problema');
});
</script>

</body>
</html>
